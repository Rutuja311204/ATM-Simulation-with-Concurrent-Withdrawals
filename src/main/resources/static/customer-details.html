<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Customer Details</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5">

<div class="card shadow">

<div class="card-header bg-primary text-white">

<h3>Customer Details</h3>

</div>

<div class="card-body">

<table class="table">

<tr>
<th>Name</th>
<td id="name"></td>
</tr>

<tr>
<th>Email</th>
<td id="email"></td>
</tr>

<tr>
<th>Phone</th>
<td id="phone"></td>
</tr>

<tr>
<th>Account Number</th>
<td id="account"></td>
</tr>

<tr>
<th>Account Type</th>
<td id="type"></td>
</tr>

<tr>
<th>Balance</th>
<td id="balance"></td>
</tr>

<tr>
<th>Status</th>
<td id="status"></td>
</tr>

</table>

<a href="customer-accounts.html" class="btn btn-primary">

Back

</a>

</div>

</div>

</div>

<script>

const id=new URLSearchParams(window.location.search).get("id");

fetch("http://localhost:8081/customer/id/"+id)

.then(res=>res.json())

.then(customer=>{

document.getElementById("name").innerHTML=customer.fullName;

document.getElementById("email").innerHTML=customer.email;

document.getElementById("phone").innerHTML=customer.phone;

document.getElementById("account").innerHTML=customer.accountNumber;

document.getElementById("type").innerHTML=customer.accountType;

document.getElementById("balance").innerHTML="₹ "+customer.balance;

document.getElementById("status").innerHTML=customer.status;

});

</script>

</body>
</html>
