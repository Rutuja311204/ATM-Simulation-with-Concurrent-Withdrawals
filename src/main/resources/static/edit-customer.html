<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Edit Customer</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5">

<div class="card shadow">

<div class="card-header bg-warning">

<h3>Edit Customer</h3>

</div>

<div class="card-body">

<div class="mb-3">
<label>Name</label>
<input type="text" id="fullName" class="form-control">
</div>

<div class="mb-3">
<label>Phone</label>
<input type="text" id="phone" class="form-control">
</div>

<div class="mb-3">
<label>Address</label>
<input type="text" id="address" class="form-control">
</div>

<div class="mb-3">
<label>Account Type</label>

<select id="accountType" class="form-select">

<option>Savings</option>

<option>Current</option>

</select>

</div>

<div class="mb-3">

<label>Status</label>

<select id="status" class="form-select">

<option>Active</option>

<option>Inactive</option>

</select>

</div>

<button class="btn btn-success" onclick="updateCustomer()">

Update Customer

</button>

<a href="customer-accounts.html" class="btn btn-secondary">

Back

</a>

</div>

</div>

</div>

<script>

const id = new URLSearchParams(window.location.search).get("id");

fetch("http://localhost:8081/customer/id/"+id)

.then(res=>res.json())

.then(customer=>{

document.getElementById("fullName").value=customer.fullName;
document.getElementById("phone").value=customer.phone;
document.getElementById("address").value=customer.address;
document.getElementById("accountType").value=customer.accountType;
document.getElementById("status").value=customer.status;

});

function updateCustomer(){

fetch("http://localhost:8081/customer/update/"+id,{

method:"PUT",

headers:{

"Content-Type":"application/json"

},

body:JSON.stringify({

fullName:document.getElementById("fullName").value,

phone:document.getElementById("phone").value,

address:document.getElementById("address").value,

accountType:document.getElementById("accountType").value,

status:document.getElementById("status").value

})

})

.then(res=>res.json())

.then(data=>{

alert("Customer Updated Successfully");

window.location.href="customer-accounts.html";

});

}

</script>

</body>

</html>
